# Tiny Tapeout project information
project:
  title:        "8-bit ALU"
  author:       "Kishan S"
  discord:      ""
  description:  "An 8-bit Arithmetic logic unit with arithmetic, logic, and shift operations."
  language:     "Verilog"
  clock_hz:     0

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project.
pinout:
  # Inputs
  ui[0]: "Operand A bit 0"
  ui[1]: "Operand A bit 1"
  ui[2]: "Operand A bit 2"
  ui[3]: "Operand A bit 3"
  ui[4]: "Operand A bit 4"
  ui[5]: "Operand A bit 5"
  ui[6]: "Operand A bit 6"
  ui[7]: "Operand A bit 7"

  # Outputs
  uo[0]: "Result bit 0"
  uo[1]: "Result bit 1"
  uo[2]: "Result bit 2"
  uo[3]: "Result bit 3"
  uo[4]: "Result bit 4"
  uo[5]: "Result bit 5"
  uo[6]: "Result bit 6"
  uo[7]: "Result bit 7"

  # Bidirectional pins
  uio[0]: "Operand B bit 0 (in)"
  uio[1]: "Operand B bit 1 (in)"
  uio[2]: "Operand B bit 2 (in)"
  uio[3]: "Operand B bit 3 (in)"
  uio[4]: "Opcode bit 0 (in)"
  uio[5]: "Opcode bit 1 (in)"
  uio[6]: "Opcode bit 2 (in)"
  uio[7]: "Opcode bit 3 (in)"

# Do not change!
yaml_version: 6
